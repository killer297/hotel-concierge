services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_hotel_concierge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dhc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_hotel_concierge"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  dhc_pgdata:
